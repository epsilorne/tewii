[project]
name = "tewii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "epsilorne", email = "32991333+epsilorne@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "watchdog>=6.0.0",
]

[project.scripts]
tewii = "tewii.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
