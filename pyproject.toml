[project]
name = "tewii"
version = "0.1.0"
description = "Seamless Markdown to LaTeX + PDF Convertor"
readme = "README.md"
authors = [
    { name = "epsilorne", email = "32991333+epsilorne@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "psutil>=7.2.2",
    "pypandoc>=1.17",
    "watchdog>=6.0.0",
]

[project.scripts]
tewii = "tewii.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-subprocess>=1.6.0",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
