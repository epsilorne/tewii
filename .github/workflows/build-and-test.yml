name: Build and Test

on: push

jobs:
  build-and-test:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

        # The tests already check if pandoc/pdflatex aren't installed, but we need
        # to mock them so the ProjectHandler can be constructed for other tests
      - name: Create mock pandoc and pdflatex
        run: |
          fake_pandoc="/tmp/fakebin/pandoc"
          fake_pdflatex="/tmp/fakebin/pdflatex"

          mkdir -p /tmp/fakebin

          echo '#!/bin/bash' > $fake_pandoc
          echo 'exit 0' >> $fake_pandoc
          chmod +x $fake_pandoc

          echo '#!/bin/bash' > $fake_pdflatex
          echo 'exit 0' >> $fake_pdflatex
          chmod +x $fake_pdflatex

          echo "/tmp/fakebin/" >> $GITHUB_PATH

      - name: Run tests
        run: uv run pytest tests
